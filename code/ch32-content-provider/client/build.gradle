plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.example.ch32client'
    compileSdk 34

    defaultConfig {
        applicationId "vn.example.ch32client"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // KHÔNG có bất kỳ implementation project(':app') nào ở đây — đây là điểm quan
    // trọng nhất của project mẫu này: :client build ra một APK HOÀN TOÀN riêng
    // biệt, không phụ thuộc code của :app, chỉ giao tiếp qua content:// URI.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
