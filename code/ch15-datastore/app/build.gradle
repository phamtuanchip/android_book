plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.example.ch15datastore'
    compileSdk 34

    defaultConfig {
        applicationId "vn.example.ch15datastore"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // DataStore lõi được viết bằng Kotlin Coroutines/Flow. Với project Java thuần,
    // dùng bridge chính thức "-rxjava3" để làm việc qua RxJava thay vì Flow.
    implementation 'androidx.datastore:datastore-preferences-rxjava3:1.1.1'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
}
